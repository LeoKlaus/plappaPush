services:
  webserver:
    build: ./src
    restart: unless-stopped
    ports:
      - "9091:80"
    volumes:
      - ./private_key.p8:/private_key.p8:ro
    env_file: .env
    depends_on:
      - database

  database:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./createTables.sql:/docker-entrypoint-initdb.d/db.sql:ro
    env_file: .env

volumes:
  pgdata:
